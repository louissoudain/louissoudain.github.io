        body {

        nav {
            position: fixed;

            display: flex;

        .nav-links a {
            text-decoration: none;
            color: #222;
            padding: 8px 14px;
            border-radius: 999px;
            transition: background 0.2s ease;
        }

        .nav-links a:hover {
            background: #ffffff;
        }

        main {
        max-width: 700px;
        padding: 40px 24px;
        }

        h1 {
        font-size: 3rem;
        margin-bottom: 16px;
        }

        p {
